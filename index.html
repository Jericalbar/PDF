<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Reader Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">PDF</span><b>PDF Reader Pro</b></div>
  <div class="tools">
    <button id="openBtn">Open</button><input id="fileInput" type="file" accept=".pdf" hidden>
    <button id="combineBtn">Combine</button><input id="combineInput" type="file" accept=".pdf" multiple hidden>
    <button id="organizeBtn">Organize</button>
    <button id="fillSignBtn">Fill & Sign</button>
    <button id="convertBtn">Convert</button>
    <button id="prevBtn">‹</button><div class="pageCtl"><input id="pageNo" type="number" value="1" min="1"> / <span id="pageTotal">0</span></div><button id="nextBtn">›</button>
    <button id="zoomOut">−</button><span id="zoom">100%</span><button id="zoomIn">+</button><button id="fitBtn">Fit</button>
    <button id="saveBtn" class="accent">Save PDF</button>
  </div>
</header>

<div class="workspace">
  <aside class="left">
    <div class="panelHead">Pages</div>
    <div id="thumbs" class="thumbs"></div>
  </aside>

  <main class="viewer">
    <div id="welcome" class="welcome">
      <div class="bigLogo">PDF</div>
      <h1>PDF Reader Pro</h1>
      <p>Read, edit, fill, sign, organize and convert PDF files.</p>
      <button id="chooseBtn" class="accent big">Choose PDF</button>
    </div>
    <div id="viewerScroll" class="viewerScroll hidden"><div id="pages"></div></div>

    <div id="editPanel" class="floating hidden">
      <div class="panelTitle">Fill & Sign</div>
      <button id="typeTool">Add Text</button>
      <button id="dateTool">Add Date</button>
      <button id="checkTool">✓ Check</button>
      <button id="crossTool">✕ Cross</button>
      <button id="signatureTool">Draw Signature</button>
      <button id="uploadSignature">Upload Signature</button>
      <input id="sigInput" type="file" accept="image/png,image/jpeg" hidden>
      <button id="closeFill">Close</button>
    </div>

    <div id="organizePanel" class="floating hidden">
      <div class="panelTitle">Organize Pages</div>
      <button id="deletePage">Delete</button>
      <button id="duplicatePage">Duplicate</button>
      <button id="rotatePage">Rotate</button>
      <button id="extractPage">Extract Selected</button>
      <button id="insertPdf">Insert PDF</button>
      <input id="insertInput" type="file" accept=".pdf" hidden>
      <button id="closeOrganize">Close</button>
      <p class="hint">Drag thumbnails to reorder pages.</p>
    </div>

    <div id="textPanel" class="floating small hidden">
      <label>Text <input id="fieldText" value="Text"></label>
      <label>Size <input id="fieldSize" type="number" value="18" min="6" max="96"></label>
      <label>Color <input id="fieldColor" type="color" value="#111111"></label>
      <button id="placeField" class="accent">Place</button>
      <button id="cancelField">Cancel</button>
    </div>

    <div id="signPanel" class="signaturePanel hidden">
      <div class="panelTitle">Draw your signature</div>
      <canvas id="signCanvas" width="520" height="180"></canvas>
      <div><button id="clearSign">Clear</button><button id="useSign" class="accent">Use Signature</button><button id="cancelSign">Cancel</button></div>
    </div>
  </main>
</div>
<footer><span id="filename">No PDF opened</span><span id="status">Ready</span></footer>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
