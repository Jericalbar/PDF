<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Reader Web</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="titlebar"><div class="appicon">PDF</div><span id="docTitle">Welcome - PDF Reader Web</span><div class="windowBtns"><span>—</span><span>□</span><span class="close">×</span></div></header>
<div class="menubar"><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span></div>
<div class="tabs"><button class="tab active">Home</button><button class="tab">Tools</button><span class="welcomeTab">Welcome</span><span>×</span><span class="help">?</span><span class="bell">●</span><b>Sign In</b></div>
<div class="mainbar">
<button id="openBtn">📂</button><button id="saveBtn">💾</button><button id="printBtn">🖨</button><button id="searchBtn">⌕</button>
<div class="sep"></div><button id="prevBtn">‹</button><div class="pageCtl"><input id="pageNo" value="1" min="1"> / <span id="pageCount">0</span></div><button id="nextBtn">›</button>
<button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button><button id="fitBtn">Fit</button><button id="moreBtn">•••</button><button id="shareBtn" class="share">⇧ Share</button>
</div>
<div class="body">
<aside class="leftRail">
<button class="rail active" data-panel="pagesPanel">▣</button><button class="rail" data-panel="bookmarkPanel">🔖</button><button class="rail" data-panel="attachPanel">📎</button>
</aside>
<aside class="leftPanel">
<div id="pagesPanel" class="sideContent"><div class="sideTitle">Pages</div><div id="thumbs"></div></div>
<div id="bookmarkPanel" class="sideContent hidden"><div class="sideTitle">Bookmarks</div><p>No bookmarks</p></div>
<div id="attachPanel" class="sideContent hidden"><div class="sideTitle">Attachments</div><p>No attachments</p></div>
</aside>
<main class="documentArea">
<div id="welcome" class="welcome"><h1>Welcome to PDF Reader Web</h1><p>Open a PDF to start.</p><button id="openWelcome" class="blue">Open PDF</button></div>
<div id="pdfScroll" class="pdfScroll hidden"><div id="pages"></div></div>
<div id="floatingText" class="floating hidden"><b>Add Text</b><input id="textValue" value="Text"><input id="textSize" type="number" value="18"><button id="placeText" class="blue">Place on page</button><button id="cancelText">Cancel</button></div>
<div id="signBox" class="signatureBox hidden"><b>Draw Signature</b><canvas id="signCanvas" width="500" height="180"></canvas><button id="clearSign">Clear</button><button id="useSign" class="blue">Use Signature</button><button id="cancelSign">Cancel</button></div>
</main>
<aside class="rightTools">
<button class="tool" id="exportBtn"><span class="ico cyan">⇥</span><span>Export PDF</span><b>⌄</b></button>
<div id="exportMenu" class="sub hidden"><button id="wordBtn">PDF → Word</button><button id="imageBtn">PDF → Images</button><button id="excelBtn">PDF → Excel</button></div>
<button class="tool" id="createBtn"><span class="ico red">▣</span><span>Create PDF</span><b>⌄</b></button>
<div id="createMenu" class="sub hidden"><button id="createFilesBtn">Combine files into PDF</button></div>
<button class="tool" id="editBtn"><span class="ico pink">▤</span><span>Edit PDF</span></button>
<button class="tool" id="commentBtn"><span class="ico yellow">▰</span><span>Comment</span></button>
<button class="tool" id="combineBtn"><span class="ico purple">⇄</span><span>Combine Files</span></button>
<button class="tool" id="organizeBtn"><span class="ico green">▤</span><span>Organize Pages</span></button>
<button class="tool" id="fillSignBtn"><span class="ico magenta">✍</span><span>Fill & Sign</span></button>
<button class="tool" id="redactBtn"><span class="ico magenta">▰</span><span>Redact</span></button>
<div class="trial"><b>PDF Reader Web</b><br>Convert and edit PDFs<br><button id="helpBtn">Learn more</button></div>
</aside>
</div>
<footer><span id="status">Ready — open a PDF</span><span id="fileName">No document</span></footer>
</div>
<input id="pdfInput" type="file" accept=".pdf,application/pdf" hidden>
<input id="multiInput" type="file" accept=".pdf,application/pdf" multiple hidden>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
