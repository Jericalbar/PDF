<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Reader Web</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="appicon">PDF</div><span id="docTitle">Welcome - PDF Reader Web</span>
    <div class="windowBtns"><span>—</span><span>□</span><span class="close">×</span></div>
  </header>
  <div class="menubar"><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span></div>
  <div class="tabs"><button class="tab active">Home</button><button class="tab">Tools</button><div class="tabspace"></div><span class="welcomeTab">Welcome</span><span class="x">×</span><span class="help">?</span><span class="bell">♟</span><b>Sign In</b></div>
  <div class="mainbar">
    <button title="Save">💾</button><button id="uploadBtn" title="Open">☁</button><button id="printBtn" title="Print">🖨</button><button title="Email">✉</button><button title="Search">⌕</button><button title="Upload">⬆</button><button title="Download">⬇</button>
    <div class="pageCtl"><input id="pageNo" value="1"> <span>/</span> <span id="pageCount">0</span></div>
    <button id="selectBtn">➤</button><span id="zoomLabel">100%</span><button id="zoomMenu">⌄</button><button id="moreBtn">•••</button><button id="shareBtn" class="share">⇧ Share</button>
  </div>

  <div class="body">
    <aside class="leftRail">
      <button class="rail active" data-panel="pagesPanel">▣</button>
      <button class="rail" data-panel="bookmarkPanel">🔖</button>
      <button class="rail" data-panel="attachPanel">📎</button>
    </aside>
    <aside id="leftPanel" class="leftPanel"><div id="pagesPanel" class="sideContent"><div class="sideTitle">Pages</div><div id="thumbs"></div></div><div id="bookmarkPanel" class="sideContent hidden"><div class="sideTitle">Bookmarks</div><p>No bookmarks</p></div><div id="attachPanel" class="sideContent hidden"><div class="sideTitle">Attachments</div><p>No attachments</p></div></aside>

    <main id="documentArea" class="documentArea">
      <div id="welcome" class="welcome">
        <h1>Welcome to PDF Reader Web</h1>
        <p>Open a PDF or choose a tool to get started.</p>
        <button id="openWelcome" class="blue">Open PDF</button>
      </div>
      <div id="pdfScroll" class="pdfScroll hidden"><div id="pages"></div></div>
    </main>

    <aside class="rightTools">
      <div class="toolGroup">
        <button class="tool" data-action="export"><span class="ico cyan">⇥</span><span>Export PDF</span><b>⌃</b></button>
        <div id="exportMenu" class="sub hidden"><button data-convert="word">Word</button><button data-convert="image">Image</button><button data-convert="excel">Excel</button></div>
      </div>
      <div class="toolGroup"><button class="tool" data-action="create"><span class="ico red">▣</span><span>Create PDF</span><b>⌄</b></button><div id="createMenu" class="sub hidden"><button id="createFromFiles">Create from files</button></div></div>
      <button class="tool" data-action="edit"><span class="ico pink">▤</span><span>Edit PDF</span></button>
      <button class="tool" data-action="comment"><span class="ico yellow">▰</span><span>Comment</span></button>
      <button class="tool" data-action="combine"><span class="ico purple">⇄</span><span>Combine Files</span><b>⌄</b></button>
      <button class="tool" data-action="organize"><span class="ico green">▤</span><span>Organize Pages</span><b>⌄</b></button>
      <button class="tool" data-action="redact"><span class="ico magenta">▰</span><span>Redact</span></button>
      <div class="trial">Convert and edit PDFs<br><b>with PDF Reader Web</b><button>Start Free Trial</button></div>
    </aside>
  </div>
</div>

<input id="pdfInput" type="file" accept=".pdf" hidden>
<input id="multiInput" type="file" accept=".pdf" multiple hidden>
<input id="createInput" type="file" multiple hidden>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
